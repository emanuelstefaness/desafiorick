<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Rick & Morty Search</title>
<style>
  body { font-family: sans-serif; background: #1e1e2f; color: #fff; padding: 20px; }
  input { padding: 8px; font-size: 16px; width: 300px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  .card { background: #2c2c44; padding: 10px; border-radius: 8px; width: 150px; text-align: center; }
  .card img { width: 100%; border-radius: 6px; }
  .status { margin-top: 10px; color: #aaa; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,typescript">
const { useState, useEffect } = React;

interface Character {
  id: number;
  name: string;
  image: string;
}

interface ApiResponse {
  results?: Character[];
}

const App: React.FC = () => {
  const [search, setSearch] = useState<string>("");
  const [characters, setCharacters] = useState<Character[]>([]);
  const [loading, setLoading] = useState<boolean>(false);

  // DESAFIO #04: log a cada letra digitada + debounce de 500ms
  useEffect(() => {
    console.log("Valor digitado:", search);

    const timer = setTimeout(() => {
      const controller = new AbortController();

      if (search.trim() === "") {
        setCharacters([]);
        return;
      }

      setLoading(true);

      fetch(`https://rickandmortyapi.com/api/character/?name=${search}`, {
        signal: controller.signal,
      })
        .then((res) => {
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          }
          return res.json();
        })
        .then((data: ApiResponse) => {
          setCharacters(data.results || []);
        })
        .catch((error: unknown) => {
          if (error instanceof DOMException && error.name === "AbortError") {
            // requisição antiga cancelada (race condition resolvida)
            return;
          }
          console.error("Fetch error:", error);
          setCharacters([]);
        })
        .finally(() => setLoading(false));

      return () => {
        controller.abort();
      };
    }, 500);

    return () => clearTimeout(timer);
  }, [search]);

  return (
    <div>
      <h1>Busca Rick & Morty</h1>
      <input
        type="text"
        placeholder="Digite o nome do personagem..."
        value={search}
        onChange={(e) => setSearch(e.target.value)}
      />
      {loading && <p className="status">Carregando...</p>}
      <div className="grid">
        {characters.map((char) => (
          <div className="card" key={char.id}>
            <img src={char.image} alt={char.name} />
            <p>{char.name}</p>
          </div>
        ))}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")!).render(<App />);
</script>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
